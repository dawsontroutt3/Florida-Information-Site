<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Ask a Question About Florida</h1>
</header>
<nav>
        <h2>Quick Links</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="tallahassee.html">Tallahassee</a></li>

            </ul>
    </nav>
<section class="main-col">
    <h2>Contact Form</h2>
    <form id="contact-form">
        <div class="form-field">
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first-name">
        </div>
        <div class="form-field">
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last-name">
        </div>
        <div class="form-field">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-field">
            <label for="confirm-email">Confirm Email Address:</label>
            <input type="email" id="confirm-email" name="confirm-email">
        </div>
        <div class="form-field">
            <label for="question">Your Question:</label>
            <textarea id="question" name="question" rows="5" cols="40"></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</section>
<aside class="side-col">
    <h2>Ask Us Anything!</h2>
    <p>Have a question about Florida's cities, climate, or attractions? Fill out the form and we'll get back to you.</p>
    <img src="images/fl_form.jpg" alt="Sandy Florida beach">
</aside>
<footer>
    <p>Sources:</p>
    <p>Image: <a href="https://www.rd.com/list/best-florida-beaches/" target="_blank">RD.com</a></p>
</footer>

</body>
